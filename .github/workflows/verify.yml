name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/audit-source.mjs
      # Allow disk-backed fixtures an I/O budget on shared Windows runners.
      - run: npm test -- --maxWorkers=1 --testTimeout=30000
      - run: npm run build
