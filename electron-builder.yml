appId: local.steam.friend-commenter
productName: 小蓝Steam工具箱
directories:
  buildResources: build
  output: dist
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
asar: true
extraResources:
  - from: resources/native-presence
    to: native-presence
    filter:
      - worker-x86.exe
      - worker-x64.exe
win:
  executableName: XiaoLanSteamToolbox
  target:
    - nsis
    - portable
nsis:
  artifactName: XiaoLan-Steam-Toolbox-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: XiaoLan-Steam-Toolbox-Portable-${version}-${arch}.${ext}
